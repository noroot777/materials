<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        @font-face { font-family: "Barlow"; font-weight: 900; font-display: block; src: url("assets/fonts/Barlow-Black.woff2") format("woff2"); }
        @font-face { font-family: "Barlow"; font-weight: 700; font-display: block; src: url("assets/fonts/Barlow-Bold.woff2") format("woff2"); }
        @font-face { font-family: "Barlow"; font-weight: 500; font-display: block; src: url("assets/fonts/Barlow-Medium.woff2") format("woff2"); }
        @font-face { font-family: "IBM Plex Mono"; font-weight: 500; font-display: block; src: url("assets/fonts/IBMPlexMono-Medium.woff2") format("woff2"); }
        @font-face { font-family: "Noto Sans SC"; font-weight: 900; font-display: block; src: url("assets/fonts/NotoSansSC-Black.woff2") format("woff2"); }
        @font-face { font-family: "Noto Sans SC"; font-weight: 500; font-display: block; src: url("assets/fonts/NotoSansSC-Medium.woff2") format("woff2"); }

        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          color: #f0ece5;
          font-family: "Noto Sans SC", sans-serif;
        }
        .f07-bg {
          position: absolute;
          inset: 0;
          background: #111111;
        }
        .f07-world {
          position: absolute;
          inset: 0;
          transform-origin: 50% 50%;
        }
        /* 镜头：截图按 1920×1080 铺满，聚光裁片画在同一坐标系里，随镜头一起缓推 */
        .f07-cam {
          position: absolute;
          left: 0;
          top: 0;
          width: 1920px;
          height: 1080px;
          transform-origin: 0 0;
          will-change: transform;
        }
        .f07-shot {
          position: absolute;
          left: 0;
          top: 0;
          display: block;
          width: 1920px;
          height: 1080px;
        }
        .f07-scrim {
          position: absolute;
          inset: 0;
          background: #111111;
          opacity: 0.6;
        }
        /* 聚光：同一张截图不压暗的裁片，盖在墨色罩上面 */
        .f07-spot {
          position: absolute;
          overflow: hidden;
          visibility: hidden;
        }
        .f07-spot-frame {
          position: absolute;
          inset: 0;
          border: 4px solid #f0ece5;
        }

        /* —— 四格环（07 / 08 共用同一张数表，位置尺寸由脚本里的 RING 写入） —— */
        .f07-ring {
          position: absolute;
        }
        .f07-ring-svg {
          position: absolute;
          left: -70px;
          top: -70px;
          width: 940px;
          height: 760px;
          overflow: visible;
        }
        .f07-link-base {
          fill: none;
          stroke: #505048;
          stroke-width: 10;
        }
        .f07-head-base {
          fill: #505048;
        }
        .f07-link {
          fill: none;
          stroke: #f0ece5;
          stroke-width: 10;
        }
        .f07-head {
          fill: #f0ece5;
          visibility: hidden;
        }
        #f07-link-back {
          stroke: #e85d26;
        }
        #f07-head-back {
          fill: #e85d26;
        }
        .f07-block {
          position: absolute;
          width: 280px;
          height: 230px;
          display: flex;
          align-items: center;
          justify-content: center;
          border: 8px solid #505048;
          background: #111111;
          color: #888880;
          font-family: "Noto Sans SC", sans-serif;
          font-weight: 900;
          font-size: 80px;
          line-height: 1;
          white-space: nowrap;
        }
        .f07-round {
          position: absolute;
          left: 280px;
          top: 260px;
          width: 240px;
          height: 100px;
          display: flex;
          align-items: center;
          justify-content: center;
          gap: 4px;
          color: #e85d26;
          font-family: "Noto Sans SC", sans-serif;
          font-weight: 900;
          font-size: 84px;
          line-height: 100px;
          white-space: nowrap;
          visibility: hidden;
        }
        .f07-round-num {
          position: relative;
          width: 54px;
          height: 100px;
          overflow: hidden;
        }
        .f07-round-col {
          position: absolute;
          left: 0;
          top: 0;
          width: 54px;
        }
        .f07-round-digit {
          display: block;
          height: 100px;
          line-height: 100px;
          text-align: center;
        }

        .f07-head-wrap {
          position: absolute;
          left: 0;
          bottom: 0;
          display: flex;
          flex-direction: column;
          align-items: flex-start;
        }
        .f07-line {
          display: block;
          font-family: "Noto Sans SC", sans-serif;
          font-weight: 900;
          letter-spacing: -0.02em;
          white-space: nowrap;
          visibility: hidden;
        }
        .f07-line-a {
          padding: 8px 48px 20px 90px;
          font-size: 150px;
          line-height: 168px;
          background: #111111;
          color: #f0ece5;
        }
        .f07-line-b {
          padding: 6px 48px 18px 90px;
          font-size: 110px;
          line-height: 124px;
          background: #e85d26;
          color: #111111;
        }
        .f07-flash {
          position: absolute;
          inset: 0;
          background: #e85d26;
          opacity: 0;
          pointer-events: none;
        }
        .f07-border {
          position: absolute;
          inset: 0;
          border: 16px solid #e85d26;
          opacity: 0;
        }
      </style>

      <div id="root" data-composition-id="07-verify" data-width="1920" data-height="1080" data-duration="3.75">
        <div class="clip f07-bg" id="f07-bg" data-start="0" data-duration="3.75" data-track-index="0"></div>

        <div class="f07-world" id="f07-world">
          <div class="f07-cam" id="f07-cam">
            <img class="f07-shot" src="assets/shots/review.png" alt="" />
            <div class="f07-scrim"></div>
            <div id="f07-spots"></div>
          </div>

          <div class="f07-ring" id="f07-ring"></div>

          <div class="f07-head-wrap">
            <span class="f07-line f07-line-a" id="f07-line-a">写完不算完</span>
            <span class="f07-line f07-line-b" id="f07-line-b">自动审查，打回重改</span>
          </div>
        </div>

        <div class="f07-border" id="f07-border"></div>
        <div class="f07-flash" id="f07-flash"></div>
      </div>

      <script>
        (function () {
          const P = "f07";
          const BEAT = 0.46875;
          const b = (n) => n * BEAT;
          const INK = "#111111";
          const ORANGE = "#e85d26";
          const CREAM = "#f0ece5";
          const tl = gsap.timeline({ paused: true });

          // —— 四格环数表（与 08-roll 逐字相同）——
          const RING = { left: 1060, top: 220, w: 800, h: 620 };
          const BLOCKS = [
            { key: "impl", label: "实现", x: 0, y: 0 },
            { key: "review", label: "审查", x: 520, y: 0 },
            { key: "reject", label: "打回", x: 520, y: 390 },
            { key: "fix", label: "修复", x: 0, y: 390 },
          ];
          const LINKS = [
            { key: "c1", d: "M280 115 H492", head: "520,115 490,96 490,134" },
            { key: "c2", d: "M660 230 V362", head: "660,390 641,360 679,360" },
            { key: "c3", d: "M520 505 H308", head: "280,505 310,486 310,524" },
            { key: "back", d: "M0 505 H-50 V-50 H660 V-28", head: "660,0 641,-30 679,-30" },
          ];
          const ring = document.getElementById(P + "-ring");
          ring.style.cssText = `left:${RING.left}px;top:${RING.top}px;width:${RING.w}px;height:${RING.h}px`;
          ring.innerHTML =
            `<svg class="${P}-ring-svg" viewBox="-70 -70 940 760">` +
            LINKS.map(
              (l) =>
                (l.key === "back" ? "" : `<path class="${P}-link-base" d="${l.d}"/><polygon class="${P}-head-base" points="${l.head}"/>`) +
                `<path class="${P}-link" id="${P}-link-${l.key}" d="${l.d}"/><polygon class="${P}-head" id="${P}-head-${l.key}" points="${l.head}"/>`,
            ).join("") +
            `</svg>` +
            BLOCKS.map((k) => `<div class="${P}-block" id="${P}-block-${k.key}" style="left:${k.x}px;top:${k.y}px">${k.label}</div>`).join("") +
            `<div class="${P}-round" id="${P}-round"><span>第</span><span class="${P}-round-num"><span class="${P}-round-col" id="${P}-round-col">` +
            [1, 2, 3, 4, 5].map((n) => `<span class="${P}-round-digit">${n}</span>`).join("") +
            `</span></span><span>轮</span></div>`;

          // —— 聚光裁片（截图坐标）——
          const SPOTS = [
            { key: "impl", x: 404, y: 224, w: 680, h: 140 },
            { key: "review", x: 404, y: 384, w: 580, h: 62 },
            { key: "fix", x: 404, y: 468, w: 640, h: 172 },
          ];
          document.getElementById("f07-spots").innerHTML = SPOTS.map(
            (s) =>
              `<div class="f07-spot" id="f07-spot-${s.key}" style="left:${s.x}px;top:${s.y}px;width:${s.w}px;height:${s.h}px">` +
              `<img class="f07-shot" src="assets/shots/review.png" alt="" style="left:${-s.x}px;top:${-s.y}px" />` +
              `<div class="f07-spot-frame" id="f07-spot-frame-${s.key}"></div></div>`,
          ).join("");

          const blk = (key) => `#${P}-block-${key}`;
          const show = (sel, at) => tl.set(sel, { visibility: "visible" }, at);
          const hide = (sel, at) => tl.set(sel, { visibility: "hidden" }, at);
          const lit = (key, at) => tl.set(blk(key), { borderColor: CREAM, color: CREAM, backgroundColor: INK }, at);
          const hot = (key, at) => tl.set(blk(key), { borderColor: ORANGE, color: INK, backgroundColor: ORANGE }, at);
          const bump = (sel, at, from, dur) =>
            tl.fromTo(sel, { scale: from }, { scale: 1, duration: dur || 0.3, ease: "back.out(2.4)", immediateRender: false }, at);
          // 连线从上一格「滑」到下一格：描边画出，到位时刻亮出箭头
          const draw = (key, at, dur, ease) => {
            const path = document.getElementById(`${P}-link-${key}`);
            const len = path.getTotalLength();
            path.style.strokeDasharray = len;
            path.style.strokeDashoffset = len;
            tl.to(path, { strokeDashoffset: 0, duration: dur, ease: ease }, at);
            show(`#${P}-head-${key}`, at + dur);
          };
          const spot = (key, at) => {
            show(`#f07-spot-${key}`, at);
            tl.fromTo(`#f07-spot-${key}`, { scale: 1.1 }, { scale: 1, duration: 0.28, ease: "power3.out" }, at);
          };

          // 全程 —— 镜头匀速缓推（截图上 (744,432) 钉在画布 (500,395)）
          const aim = (s) => ({ x: 500 - 744 * s, y: 395 - 432 * s, scale: s });
          tl.fromTo("#f07-cam", aim(1.3), { ...aim(1.456), duration: 3.75, ease: "none" }, 0);

          // b0 —— 「写完不算完」砸入（先贴底，b5 被第二行顶上去）
          show("#f07-line-a", 0);
          tl.fromTo("#f07-line-a", { xPercent: -100, y: 148 }, { xPercent: 0, y: 148, duration: 0.3, ease: "power4.out" }, 0);
          tl.fromTo("#f07-flash", { opacity: 0.35 }, { opacity: 0, duration: 0.3, ease: "power2.out" }, 0);

          // b1 —— 实现
          lit("impl", b(1));
          bump(blk("impl"), b(1), 1.16);
          spot("impl", b(1));
          draw("c1", b(1) + 0.14, BEAT - 0.14, "power2.in");

          // b2 —— 审查
          lit("review", b(2));
          bump(blk("review"), b(2), 1.16);
          hide("#f07-spot-impl", b(2));
          spot("review", b(2));
          draw("c2", b(2) + 0.14, BEAT - 0.14, "power2.in");

          // b3 —— 打回：本帧最重的一拍，橙底墨字 + 整屏一震 + 截图上「未通过」那一行变橙框
          hot("reject", b(3));
          bump(blk("reject"), b(3), 1.3, 0.34);
          tl.set("#f07-spot-frame-review", { borderColor: ORANGE, borderWidth: 7 }, b(3));
          tl.fromTo("#f07-spot-review", { scale: 1.16 }, { scale: 1, duration: 0.3, ease: "power3.out", immediateRender: false }, b(3));
          tl.fromTo("#f07-flash", { opacity: 0.55 }, { opacity: 0, duration: 0.28, ease: "power2.out", immediateRender: false }, b(3));
          tl.fromTo("#f07-border", { opacity: 1 }, { opacity: 0, duration: 0.4, ease: "power2.out", immediateRender: false }, b(3));
          tl.to(
            "#f07-world",
            {
              keyframes: [
                { x: -30, y: 14, scale: 1.035, duration: 0.04 },
                { x: 26, y: -12, duration: 0.05 },
                { x: -18, y: 8, duration: 0.05 },
                { x: 12, y: -5, duration: 0.05 },
                { x: -6, y: 2, duration: 0.05 },
                { x: 0, y: 0, scale: 1, duration: 0.07 },
              ],
              ease: "none",
            },
            b(3),
          );
          draw("c3", b(3) + 0.14, BEAT - 0.14, "power2.in");

          // b4 —— 修复（打回落回常亮）
          lit("reject", b(4));
          lit("fix", b(4));
          bump(blk("fix"), b(4), 1.16);
          hide("#f07-spot-review", b(4));
          spot("fix", b(4));

          // b5 —— 第二行标题砸入，把第一行顶上去；四格十六分依次顶一下
          show("#f07-line-b", b(5) - 0.06);
          tl.fromTo("#f07-line-b", { xPercent: -100 }, { xPercent: 0, duration: 0.26, ease: "power4.out" }, b(5) - 0.06);
          tl.to("#f07-line-a", { y: 0, duration: 0.26, ease: "power4.out" }, b(5) - 0.06);
          BLOCKS.forEach((k, i) => bump(blk(k.key), b(5) + i * (BEAT / 4), 1.07, 0.2));

          // b6 —— 回转箭头：修复 → 审查
          draw("back", b(6), 0.4, "power2.out");
          bump(blk("fix"), b(6), 1.1, 0.24);
          bump(`#${P}-head-back`, b(6) + 0.4, 2);

          // b7 —— 「第 1 轮」弹出，审查顶一下，橙框闪
          show(`#${P}-round`, b(7));
          tl.fromTo(`#${P}-round`, { scale: 2.4 }, { scale: 1, duration: 0.3, ease: "back.out(2)" }, b(7));
          bump(blk("review"), b(7), 1.12);
          tl.fromTo("#f07-border", { opacity: 1 }, { opacity: 0, duration: 0.42, ease: "power2.out", immediateRender: false }, b(7));
          tl.fromTo("#f07-world", { scale: 1.03 }, { scale: 1, duration: 0.3, ease: "power2.out", immediateRender: false }, b(7));

          window.__timelines["07-verify"] = tl;
          tl.seek(0);
        })();
      </script>
    </template>
  </body>
</html>
