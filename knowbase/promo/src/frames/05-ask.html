<script>
  // 问题先占满整版敲出来,答案开始流的那一拍缩到左上角
  var qb = $('.qb'), ls = $$('.qb .tx'), crs = $$('.qb .cr');
  slam(qb, 26.958, { y: 70 }, 0.22);
  typeOn(ls[0], 27.02, 27.44);
  typeOn(ls[1], 27.5, 27.76);
  gsap.set(crs[1], { opacity: 0 });
  tl.set(crs[0], { opacity: 0 }, at(27.5));
  tl.set(crs[1], { opacity: 1 }, at(27.5));
  tl.set(crs[1], { opacity: 0 }, at(27.91));
  tl.to(qb, { scale: 0.4, y: -214, duration: 0.28, ease: 'expo.out' }, at(27.91));

  // 答案一拍一行;每行的出处编号先弹出来,名字跟上
  var lands = [27.91, 28.398, 28.886, 29.35, 29.838, 30.302];
  $$('.an').forEach(function (an, i) {
    tl.fromTo(an.querySelector('.ix'), { scale: 0 }, { scale: 1, duration: 0.2, ease: 'back.out(2.4)' }, at(lands[i]));
    slam(an.querySelector('.nm'), lands[i] + 0.03, { x: 90 }, 0.24);
    slam(an.querySelector('.ac'), lands[i] + 0.12, { x: 50 }, 0.24);
  });

  // 总数在第一行答案出来时开始滚,落在抽掉低频的那一拍上
  slam($('.tot .n'), 27.91, { y: 90 }, 0.2);
  roll($('.tot .n'), 27.91, 28.886);
  tl.fromTo($('.un .bg'), { scaleX: 0 }, { scaleX: 1, duration: 0.22, ease: 'expo.out' }, at(28.886));
  rise($('.un .tx > span'), 28.886 + 0.04, 0, 0.26);

  // 空拍那一小节:整版慢慢顶上去,攒到 30.79 那一刀
  push($('.all'), 28.886, 30.79, 1, 1.025, { transformOrigin: '50% 50%' });
</script>
