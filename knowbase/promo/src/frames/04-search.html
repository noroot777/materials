<style>
/* 检索:一个大输入框敲字、回车,框缩到顶上,三张真实的结果卡逐拍落下 */
#ROOT .bar { position: absolute; left: 110px; top: 150px; width: 1700px; height: 260px; display: flex; align-items: center; background: var(--kb-card); border: 6px solid var(--kb-ink); border-radius: 34px; overflow: hidden; transform-origin: 0% 0%; }
#ROOT .bar .q { flex: 1; padding-left: 60px; font-size: 140px; font-weight: 600; line-height: 248px; white-space: nowrap; }
#ROOT .bar .cr { display: inline-block; width: 12px; height: 150px; margin-left: 8px; vertical-align: -22px; background: var(--kb-brand); }
#ROOT .bar .go { width: 400px; height: 100%; background: var(--kb-ink); color: var(--kb-paper); font-size: 120px; line-height: 248px; text-align: center; }
#ROOT .fact { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
#ROOT .fr { position: absolute; left: 110px; height: 270px; display: flex; align-items: flex-end; gap: 40px; }
#ROOT .fr .n { font-size: 250px; font-weight: 700; line-height: 270px; letter-spacing: -9px; }
#ROOT .fr .u { font-size: 142px; color: var(--kb-brand); margin-bottom: 24px; }
#ROOT .res { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
#ROOT .res img { display: block; position: absolute; left: 110px; }
#ROOT .hdr { position: absolute; left: 0; top: 0; width: 1920px; height: 216px; background: var(--kb-paper); border-bottom: 2px solid var(--kb-line); opacity: 0; }
#ROOT .band { position: absolute; left: 0; top: 680px; width: 1920px; height: 400px; display: flex; align-items: center; justify-content: center; gap: 56px; }
#ROOT .band span { display: block; font-size: 236px; line-height: 300px; padding: 0 34px; white-space: nowrap; }
#ROOT .band .x { font-family: var(--kb-mono); font-weight: 400; font-size: 190px; padding: 0; }
</style>

<div class="kb-g kb-first kb-paper" data-g="1">
  <div class="fact">
    <div class="fr" style="top:470px"><span class="n kb-mono">31,692</span><span class="u kb-display kb-mask"><span>篇文档</span></span></div>
    <div class="fr" style="top:760px"><span class="n kb-mono">80,885</span><span class="u kb-display kb-mask"><span>个片段</span></span></div>
  </div>
  <div class="res">
    <img src="assets/search-1.jpg" width="2300" style="top:236px" alt="">
    <img src="assets/search-2.jpg" width="2300" style="top:606px" alt="">
    <img src="assets/search-3.jpg" width="2300" style="top:976px" alt="">
  </div>
  <i class="hdr"></i>
  <div class="bar"><span class="q"><span class="tx">claude code 记忆</span><i class="cr"></i></span><span class="go kb-display">检索</span></div>
  <div class="band kb-ink"><span class="kw kb-display">关键词</span><span class="x">×</span><span class="sem kb-display">语义</span></div>
</div>

<script>
  // 第一小节:敲字。底下两个数是这个框搜的是多大一个库
  slam($('.bar'), 23.127, { y: 90 }, 0.24);
  typeOn($('.bar .tx'), 23.22, 23.95);
  var ns = $$('.fr .n'), us = $$('.fr .u > span');
  slam(ns[0], 23.127, { y: 60 }, 0.2); roll(ns[0], 23.127, 23.591); rise(us[0], 23.591, 0, 0.22);
  slam(ns[1], 23.36, { y: 60 }, 0.2); roll(ns[1], 23.36, 23.83); rise(us[1], 23.83, 0, 0.22);

  // 回车:按钮亮一下,框缩到顶上,数字让位
  tl.to($('.bar .go'), { backgroundColor: '#17604F', duration: 0.06 }, at(24.079) - 0.05);
  tl.set($('.bar .cr'), { opacity: 0 }, at(24.079));
  tl.to($('.bar'), { y: -106, scale: 0.6, duration: 0.3, ease: 'expo.out' }, at(24.079));
  tl.to($('.fact'), { opacity: 0, y: 120, duration: 0.16, ease: 'power2.in' }, at(24.079) - 0.04);
  tl.set($('.hdr'), { opacity: 1 }, at(24.079) + 0.2);

  // 第一张跟着回车就到,之后一拍一张;第三张进来时整列往上让一格,从顶上那条底下滚过去
  var cards = $$('.res img');
  slam(cards[0], 24.079 + 0.1, { y: 220 }, 0.3);
  slam(cards[1], 24.543, { y: 150 }, 0.26);
  slam(cards[2], 25.031, { y: 150 }, 0.26);
  tl.to($('.res'), { y: -380, duration: 0.3, ease: 'expo.out' }, at(25.031));
  tl.to($('.res'), { y: -750, duration: 0.3, ease: 'expo.out' }, at(25.519));

  // 关键词 × 语义:墨色横条从底下顶上来
  tl.fromTo($('.band'), { yPercent: 100 }, { yPercent: 0, duration: 0.24, ease: 'expo.out' }, at(25.983));
  slam($('.band .kw'), 25.983 + 0.04, { x: -160 }, 0.26);
  slam($('.band .sem'), 25.983 + 0.04, { x: 160 }, 0.26);
  tl.fromTo($('.band .x'), { rotation: -180, scale: 0 }, { rotation: 0, scale: 1, duration: 0.3, ease: 'expo.out' }, at(25.983) + 0.06);
  tl.to($('.band .sem'), { backgroundColor: '#17604F', color: '#FFFFFF', duration: 0.1 }, at(26.471));
  tl.fromTo($('.band .x'), { rotation: 0 }, { rotation: 90, duration: 0.3, ease: 'expo.out', immediateRender: false }, at(26.471));
  tl.fromTo($('.band'), { scale: 1.05 }, { scale: 1, duration: 0.34, ease: 'expo.out', transformOrigin: '50% 100%', immediateRender: false }, at(26.471));
</script>
